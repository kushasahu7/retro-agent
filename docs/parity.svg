<text x="18.0" y="48" fill="#3fb950" xml:space="preserve" textLength="9.0" lengthAdjust="spacingAndGlyphs">$</text>
<text x="36.0" y="48" fill="#ffffff" xml:space="preserve" textLength="108.0" lengthAdjust="spacingAndGlyphs">retro parity</text>
<text x="18" y="86.0" fill="#c9d1d9" xml:space="preserve" textLength="783.0" lengthAdjust="spacingAndGlyphs">                sess  turn ts  real span    kind  edit tgt  err known  tokens  unk recs</text>
<text x="18" y="105.0" fill="#6e7681" xml:space="preserve" textLength="792.0" lengthAdjust="spacingAndGlyphs">----------------------------------------------------------------------------------------</text>
<text x="18" y="124.0" fill="#c9d1d9" xml:space="preserve" textLength="783.0" lengthAdjust="spacingAndGlyphs">claude-code        3     100%       100%    100%      100%       100%    100%         0</text>
<text x="18" y="143.0" fill="#c9d1d9" xml:space="preserve" textLength="783.0" lengthAdjust="spacingAndGlyphs">codex              1     100%         0%    100%      100%       100%    100%         0</text>
<text x="18" y="181.0" fill="#c9d1d9" xml:space="preserve" textLength="621.0" lengthAdjust="spacingAndGlyphs">Each column is COVERAGE, not behaviour. A metric may only be compared</text>
<text x="18" y="200.0" fill="#c9d1d9" xml:space="preserve" textLength="666.0" lengthAdjust="spacingAndGlyphs">across agents where both adapters score high on the columns it depends on:</text>
<text x="18" y="219.0" fill="#c9d1d9" xml:space="preserve" textLength="522.0" lengthAdjust="spacingAndGlyphs">  duration      -&gt; real span      churn        -&gt; edit tgt</text>
<text x="18" y="238.0" fill="#c9d1d9" xml:space="preserve" textLength="504.0" lengthAdjust="spacingAndGlyphs">  flail rate    -&gt; err known      token spend  -&gt; tokens</text>
<text x="18" y="276.0" fill="#d29922" xml:space="preserve" textLength="72.0" lengthAdjust="spacingAndGlyphs">WARNINGS</text>
<text x="18" y="295.0" fill="#d29922" xml:space="preserve" textLength="711.0" lengthAdjust="spacingAndGlyphs">  do NOT compare duration across agents: codex covers only 0% vs 100% elsewhere</text>

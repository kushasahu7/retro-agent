<svg xmlns="http://www.w3.org/2000/svg" width="984" height="497" viewBox="0 0 984 497" font-family="monospace" font-size="13.0">
<rect width="984" height="497" rx="8" fill="#0d1117"/>
<rect width="984" height="30" rx="8" fill="#161b22"/>
<rect y="22" width="984" height="8" fill="#161b22"/>
<circle cx="18" cy="15.0" r="5.5" fill="#ff5f56"/>
<circle cx="35" cy="15.0" r="5.5" fill="#ffbd2e"/>
<circle cx="52" cy="15.0" r="5.5" fill="#27c93f"/>
<text x="492.0" y="19.5" fill="#6e7681" text-anchor="middle" font-size="11.5">retro consent</text>
<text x="18.0" y="48" fill="#3fb950" xml:space="preserve" textLength="9.0" lengthAdjust="spacingAndGlyphs">$</text>
<text x="36.0" y="48" fill="#ffffff" xml:space="preserve" textLength="117.0" lengthAdjust="spacingAndGlyphs">retro consent</text>
<text x="18" y="86.0" fill="#c9d1d9" xml:space="preserve" textLength="666.0" lengthAdjust="spacingAndGlyphs">retro is about to create a PERMANENT local copy of data your coding agents</text>
<text x="18" y="105.0" fill="#c9d1d9" xml:space="preserve" textLength="279.0" lengthAdjust="spacingAndGlyphs">currently delete on a schedule.</text>
<text x="18" y="143.0" fill="#c9d1d9" xml:space="preserve" textLength="693.0" lengthAdjust="spacingAndGlyphs">  Stored:   full session transcripts, your prompt history, and file snapshots</text>
<text x="18" y="162.0" fill="#c9d1d9" xml:space="preserve" textLength="225.0" lengthAdjust="spacingAndGlyphs">  Location: ~/retro-agent</text>
<text x="18" y="181.0" fill="#c9d1d9" xml:space="preserve" textLength="621.0" lengthAdjust="spacingAndGlyphs">  Contains: whatever your sessions contained, which in practice means</text>
<text x="18" y="200.0" fill="#c9d1d9" xml:space="preserve" textLength="639.0" lengthAdjust="spacingAndGlyphs">            credentials, database URLs, other people&#x27;s email addresses,</text>
<text x="18" y="219.0" fill="#c9d1d9" xml:space="preserve" textLength="351.0" lengthAdjust="spacingAndGlyphs">            and proprietary source code</text>
<text x="18" y="257.0" fill="#c9d1d9" xml:space="preserve" textLength="297.0" lengthAdjust="spacingAndGlyphs">  Protections applied by default:</text>
<text x="18" y="276.0" fill="#c9d1d9" xml:space="preserve" textLength="423.0" lengthAdjust="spacingAndGlyphs">    - directory 0700, files 0600, database 0600</text>
<text x="18" y="295.0" fill="#c9d1d9" xml:space="preserve" textLength="639.0" lengthAdjust="spacingAndGlyphs">    - credentials redacted BEFORE they are written  (redact_on_archive)</text>
<text x="18" y="314.0" fill="#c9d1d9" xml:space="preserve" textLength="711.0" lengthAdjust="spacingAndGlyphs">    - Cursor before/after source code excluded      (cursor_include_code=false)</text>
<text x="18" y="333.0" fill="#c9d1d9" xml:space="preserve" textLength="405.0" lengthAdjust="spacingAndGlyphs">    - no network access anywhere in this tool</text>
<text x="18" y="371.0" fill="#c9d1d9" xml:space="preserve" textLength="252.0" lengthAdjust="spacingAndGlyphs">  Still your responsibility:</text>
<text x="18" y="390.0" fill="#c9d1d9" xml:space="preserve" textLength="585.0" lengthAdjust="spacingAndGlyphs">    - the archive is NOT encrypted unless you run `retro encrypt`</text>
<text x="18" y="409.0" fill="#c9d1d9" xml:space="preserve" textLength="657.0" lengthAdjust="spacingAndGlyphs">    - exclude ~/retro-agent from Time Machine / iCloud / Dropbox, or your</text>
<text x="18" y="428.0" fill="#c9d1d9" xml:space="preserve" textLength="441.0" lengthAdjust="spacingAndGlyphs">      credential history ends up in cloud backups</text>
<text x="18" y="447.0" fill="#c9d1d9" xml:space="preserve" textLength="648.0" lengthAdjust="spacingAndGlyphs">    - the archive holds third-party personal data; if this is not purely</text>
<text x="18" y="466.0" fill="#c9d1d9" xml:space="preserve" textLength="450.0" lengthAdjust="spacingAndGlyphs">      personal use, that carries legal obligations</text>
</svg>